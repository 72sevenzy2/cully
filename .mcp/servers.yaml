version: v1
servers:
    - name: buddy
      description: buddy MCP server
      image: registry.mcpruntime.org/org/buddy-mcp/buddy
      imageTag: ae58a7e
      route: /buddy/mcp
      publicPathPrefix: buddy
      port: 8080
      replicas: 1
      envVars:
        - name: BUDDY_DATA_API_URL
          value: https://workspace.mcpruntime.org/buddy-data
      secretEnvVars:
        - name: BUDDY_DATA_API_TOKEN
          secretKeyRef:
            name: buddy-data-api-token
            key: BUDDY_DATA_API_TOKEN
      namespace: mcp-servers
      tools:
        - name: buddy_log
          description: buddy_log tool
          requiredTrust: low
          sideEffect: write
        - name: buddy_search
          description: buddy_search tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_recent
          description: buddy_recent tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_get
          description: buddy_get tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_update
          description: buddy_update tool
          requiredTrust: medium
          sideEffect: write
        - name: buddy_delete
          description: buddy_delete tool
          requiredTrust: high
          sideEffect: destructive
        - name: buddy_projects
          description: buddy_projects tool
          requiredTrust: low
          sideEffect: read
      auth:
        mode: none
        humanIDHeader: X-MCP-Human-ID
        agentIDHeader: X-MCP-Agent-ID
        teamIDHeader: X-MCP-Team-ID
        sessionIDHeader: X-MCP-Agent-Session
        tokenHeader: Authorization
      policy:
        mode: allow-list
        defaultDecision: deny
        enforceOn: call_tool
        policyVersion: v1
      session:
        store: kubernetes
        headerName: X-MCP-Agent-Session
        maxLifetime: 24h
        idleTimeout: 1h
        upstreamTokenHeader: Authorization
      gateway: {}
