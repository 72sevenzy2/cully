version: v1
servers:
    - name: buddy
      description: buddy MCP server
      image: registry.mcpruntime.org/org/buddy-mcp/buddy
      imageTag: bb82270
      route: /buddy/mcp
      publicPathPrefix: buddy
      port: 8080
      replicas: 1
      envVars:
        - name: BUDDY_DATA_API_URL
          value: https://workspace.mcpruntime.org/buddy-data
        - name: BUDDY_PORT
          value: "8080"
      secretEnvVars:
        - name: BUDDY_DATA_API_TOKEN
          secretKeyRef:
            name: buddy-data-api-token
            key: BUDDY_DATA_API_TOKEN
      namespace: mcp-servers
      tools:
        - name: buddy_log
          description: buddy_log tool
          requiredTrust: low
          sideEffect: write
        - name: buddy_search
          description: buddy_search tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_recent
          description: buddy_recent tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_get
          description: buddy_get tool
          requiredTrust: low
          sideEffect: read
        - name: buddy_update
          description: buddy_update tool
          requiredTrust: medium
          sideEffect: write
        - name: buddy_delete
          description: buddy_delete tool
          requiredTrust: high
          sideEffect: destructive
        - name: buddy_projects
          description: buddy_projects tool
          requiredTrust: low
          sideEffect: read
      auth:
        mode: oauth
        humanIDHeader: X-MCP-Human-ID
        agentIDHeader: X-MCP-Agent-ID
        teamIDHeader: X-MCP-Team-ID
        sessionIDHeader: X-MCP-Agent-Session
        tokenHeader: Authorization
        issuerURL: https://auth.mcpruntime.org/mcp-auth
        audience: https://mcp.mcpruntime.org/buddy/mcp
      # Observe mode: record decisions for analytics without deny-by-default.
      # Switch to allow-list + deny when adapter grants should enforce access.
      policy:
        mode: observe
        defaultDecision: allow
        enforceOn: call_tool
        policyVersion: v1
      session:
        store: memory
        headerName: X-MCP-Agent-Session
        maxLifetime: 24h
        idleTimeout: 1h
        upstreamTokenHeader: Authorization
      gateway:
        enabled: true
      # Explicit analytics so current (pre-#511) operator/runtime-api emit events.
      # After #511 lands, omitting analytics is enough when the gateway is on.
      analytics:
        ingestURL: http://mcp-sentinel-ingest.mcp-sentinel.svc.cluster.local:8081/events
