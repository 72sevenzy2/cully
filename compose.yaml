# Future in-place deployment on the existing memory VM. Set CULLY_DB_VOLUME
# to the actual existing volume; never silently initialize a replacement.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CULLY_DB_NAME:?set existing database name}
      POSTGRES_USER: ${CULLY_DB_USER:?set existing database user}
      POSTGRES_PASSWORD: ${CULLY_DB_PASSWORD:?set existing database password}
    volumes:
      - memory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]
  migrate:
    profiles: [ops]
    build:
      context: .
      dockerfile: Dockerfile.data-api
    command: [migrate]
    environment:
      CULLY_DATABASE_URL: ${CULLY_DATABASE_URL:?set database URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  data-api:
    build:
      context: .
      dockerfile: Dockerfile.data-api
    restart: unless-stopped
    environment:
      CULLY_DATABASE_URL: ${CULLY_DATABASE_URL:?set database URL}
      CULLY_DATA_API_TOKEN: ${CULLY_DATA_API_TOKEN:?set service token}
      CULLY_MEM0_URL: ${CULLY_MEM0_URL:-}
      CULLY_MEM0_API_KEY: ${CULLY_MEM0_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8083"]
    healthcheck:
      test: ["CMD", "/cully-data", "health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [private, workspace]

volumes:
  memory-data:
    external: true
    name: ${CULLY_DB_VOLUME:?set actual existing Docker volume name}

networks:
  private:
    internal: true
  workspace:
    external: true
    name: workspace_workspace
