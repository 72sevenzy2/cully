# Add to compose.yaml for a complete local stack with self-hosted Mem0.
services:
  mem0-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${CULLY_MEM0_DB_PASSWORD:?set CULLY_MEM0_DB_PASSWORD}
    volumes:
      - mem0-data:/var/lib/postgresql/data
      - ./mem0-init-db.sql:/docker-entrypoint-initdb.d/10-mem0-app.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
  mem0:
    build: https://github.com/mem0ai/mem0.git#c93420c49a6b14c3d446bdb156d96811908fd90a:server
    restart: unless-stopped
    command: [sh, -c, 'alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000']
    environment:
      POSTGRES_HOST: mem0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${CULLY_MEM0_DB_PASSWORD:?set CULLY_MEM0_DB_PASSWORD}
      POSTGRES_COLLECTION_NAME: cully_memories
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_API_KEY: ${CULLY_MEM0_OPENAI_API_KEY:?set embedding provider key}
      ADMIN_API_KEY: ${CULLY_MEM0_API_KEY:?set CULLY_MEM0_API_KEY}
      JWT_SECRET: ${CULLY_MEM0_JWT_SECRET:?set CULLY_MEM0_JWT_SECRET}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
    volumes: [mem0-history:/app/history]
    depends_on:
      mem0-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private, edge]
  data-api:
    environment:
      CULLY_MEM0_URL: http://mem0:8000
      CULLY_MEM0_API_KEY: ${CULLY_MEM0_API_KEY:?set CULLY_MEM0_API_KEY}
    depends_on:
      mem0:
        condition: service_healthy
volumes:
  mem0-data:
  mem0-history:
