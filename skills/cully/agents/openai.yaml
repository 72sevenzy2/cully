interface:
  display_name: "Cully"
  short_description: "Remember and retrieve coding project work"
  default_prompt: "Use $cully to log this work to the shared project memory."

dependencies:
  tools:
    - type: "mcp"
      value: "cully"
      description: "Shared Cully work memory"
      transport: "streamable_http"
      url: "https://mcp.mcpruntime.org/cully/mcp"

policy:
  allow_implicit_invocation: true
