name: Unit Test
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests
        run: go test ./... -race -count=1
      - name: Deployment controller unit tests
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Self-hosted credential tests
        run: python3 -m unittest discover -s deploy/self-hosted -p 'test_*.py' -v
