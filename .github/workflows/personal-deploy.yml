name: Personal Cully deployment
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published Cully release tag
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: cully-personal-production
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  MCP_IMAGE: ghcr.io/mcp-runtime/cully-mcp:${{ inputs.tag }}
  DATA_IMAGE: ghcr.io/mcp-runtime/cully-data:${{ inputs.tag }}
  MEM0_IMAGE: ghcr.io/mcp-runtime/cully-mem0:${{ inputs.tag }}
  MCP_RUNTIME_VERSION: v0.6.1
  MCP_RUNTIME_SHA256: 0f8ea74b54be043763fbf105245b8894b00b2bbe17beb3516b44ae0c43fb0165
  MCP_PLATFORM_API_URL: https://platform.mcpruntime.org
  SERVER_NAME: cully
  IMAGE_REGISTRY: registry.mcpruntime.org/org/cully-mcp
jobs:
  service-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag and deployment controller
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?", os.environ["RELEASE_TAG"])'
          python3 -m unittest discover -s deploy -p 'test_personal_data_controller.py' -v
          sh -n deploy/bootstrap-personal-data.sh
      - name: Check live MCP Auth issuer and signing keys
        run: python3 deploy/check_personal_oauth.py issuer
      - name: Build MCP, data and local-model Mem0 images
        run: |
          docker build -f Dockerfile --build-arg VERSION="$RELEASE_TAG" -t "$MCP_IMAGE" .
          docker build -f Dockerfile.data-api -t "$DATA_IMAGE" .
          docker build -f Dockerfile.mem0 -t "$MEM0_IMAGE" .
      - name: Scan pinned Mem0 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.MEM0_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release service images
        run: |
          docker push "$MCP_IMAGE"
          docker push "$DATA_IMAGE"
          docker push "$MEM0_IMAGE"
  deploy:
    needs: service-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      MCP_PLATFORM_API_TOKEN: ${{ secrets.MCP_PLATFORM_API_TOKEN }}
      DEPLOY_HOST: ${{ vars.CULLY_PERSONAL_HOST }}
      DEPLOY_USER: ${{ vars.CULLY_PERSONAL_SSH_USER }}
      DEPLOY_PORT: ${{ vars.CULLY_PERSONAL_SSH_PORT }}
      DEPLOY_ENABLED: ${{ vars.CULLY_PERSONAL_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.CULLY_PERSONAL_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CULLY_PERSONAL_KNOWN_HOSTS || secrets.CULLY_WEB_KNOWN_HOSTS }}
          DATA_API_TOKEN: ${{ secrets.CULLY_DATA_API_TOKEN }}
        run: |
          test "$DEPLOY_ENABLED" = true || { echo '::error::Set CULLY_PERSONAL_DEPLOY_ENABLED=true after the VM bootstrap; a release must not silently skip deployment.'; exit 1; }
          test -n "$MCP_PLATFORM_API_TOKEN"
          test -n "$DATA_API_TOKEN"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/cully-personal"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Install pinned MCP Runtime CLI
        run: |
          curl -fsSL -o mcp-runtime "https://github.com/mcp-runtime/mcp-runtime/releases/download/${MCP_RUNTIME_VERSION}/mcp-runtime-linux-amd64"
          echo "${MCP_RUNTIME_SHA256}  mcp-runtime" | sha256sum -c -
          sudo install -m 0755 mcp-runtime /usr/local/bin/mcp-runtime
          mcp-runtime --version
      - name: Build and publish MCP service image
        run: |
          mcp-runtime auth status
          mcp-runtime server validate --metadata-dir .mcp
          mcp-runtime server build image "$SERVER_NAME" --registry "$IMAGE_REGISTRY" --tag "$RELEASE_TAG" --platform linux/amd64 --metadata-dir .mcp
          image="$(yq ".servers[] | select(.name == \"${SERVER_NAME}\") | .image + \":\" + .imageTag" .mcp/servers.yaml)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          mcp-runtime server push --image "$image"
      - name: Deploy personal databases, Mem0 and data service
        id: data
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"action":"deploy","tag":os.environ["RELEASE_TAG"],"token":os.environ["GHCR_TOKEN"],"registry_user":os.environ["GITHUB_ACTOR"]}))' |
            ssh -i "$HOME/.ssh/cully-personal" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" deploy
      - name: Deploy personal MCP service
        id: mcp
        env:
          CULLY_DATA_API_TOKEN: ${{ secrets.CULLY_DATA_API_TOKEN }}
        run: |
          python3 deploy/prepare_personal_metadata.py .mcp/servers.yaml
          mcp-runtime server validate --metadata-dir .mcp
          mcp-runtime server deploy "$SERVER_NAME" --metadata-dir .mcp --update
      - name: Verify MCP Runtime placement and public OAuth route
        run: |
          mcp-runtime server get "$SERVER_NAME" --namespace mcp-servers
          mcp-runtime server status --namespace mcp-servers
          python3 deploy/check_personal_oauth.py auth
          python3 deploy/check_personal_oauth.py resource
      - name: Roll back personal services if MCP deployment fails
        if: failure() && steps.data.outcome == 'success' && steps.mcp.outcome == 'failure'
        run: |
          python3 -c 'import json,os; print(json.dumps({"action":"rollback","tag":os.environ["RELEASE_TAG"]}))' |
            ssh -i "$HOME/.ssh/cully-personal" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" deploy
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$HOME/.ssh/cully-personal"
