name: CI
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'skills/**'
      - 'go.mod'
      - 'go.sum'
      - 'install.sh'
      - 'Dockerfile'
      - 'Dockerfile.data-api'
      - 'compose.yaml'
      - '.env.example'
      - '.mcp/**'
      - 'deploy/personal_data_controller.py'
      - 'deploy/test_personal_data_controller.py'
      - 'deploy/compose.personal-data.yaml'
      - 'deploy/bootstrap-personal-data.sh'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/personal-deploy.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'skills/**'
      - 'go.mod'
      - 'go.sum'
      - 'install.sh'
      - 'Dockerfile'
      - 'Dockerfile.data-api'
      - 'compose.yaml'
      - '.env.example'
      - '.mcp/**'
      - 'deploy/personal_data_controller.py'
      - 'deploy/test_personal_data_controller.py'
      - 'deploy/compose.personal-data.yaml'
      - 'deploy/bootstrap-personal-data.sh'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/personal-deploy.yml'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations skills)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1
      - name: Installer syntax
        run: bash -n install.sh
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cully_test
          POSTGRES_USER: cully_test
          POSTGRES_PASSWORD: cully_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cully_test -d cully_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CULLY_TEST_DATABASE_URL: postgresql://cully_test:cully_test@127.0.0.1:5432/cully_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/store/postgres -race -count=1 -v
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cully-mcp:test .
      - run: docker build -f Dockerfile.data-api -t cully-data:test .
      - name: Personal deployment controller
        run: |
          python3 -m unittest discover -s deploy -p 'test_personal_data_controller.py' -v
          sh -n deploy/bootstrap-personal-data.sh
