name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and CI tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
